name = "threatwatch-intel"
main = "worker.js"
compatibility_date = "2025-09-01"

# Create once with:  npx wrangler kv namespace create INTEL
# then paste the returned id below.
[[kv_namespaces]]
binding = "INTEL"
id = "159b5562b95446f8a0c3586912dbc1ce"

[triggers]
# */15 → CVE.org ingestion · :07 hourly → upstream advisories
crons = ["*/15 * * * *", "7 * * * *"]
